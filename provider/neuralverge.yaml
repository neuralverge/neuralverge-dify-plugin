identity:
  author: "neuralverge"
  name: "neuralverge"
  label:
    en_US: "NeuralVerge"
  description:
    en_US: "NeuralVerge is the data layer for agentic AI. Ask a question in plain language and get a structured, cited answer drawn from 300+ sources — e-commerce marketplaces, corporate registries, company intelligence, enrichment and social — plus the open web. Connect over MCP or REST."
  icon: "icon.svg"
  icon_dark: "icon-dark.svg"
  tags:
    - search
    - business
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: "API key"
    placeholder:
      en_US: "Your NeuralVerge API key"
    help:
      en_US: "Create a key in the NeuralVerge dashboard under Settings → API."
    url: "https://neuralverge.ai"
