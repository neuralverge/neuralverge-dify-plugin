identity:
  name: run_producthunt_users_comments
  author: neuralverge
  label:
    en_US: "Product Hunt user comments"
description:
  human:
    en_US: "Comments of a Product Hunt user, taken from their activity feed (comments filter), all pages. 1 point per returned record."
  llm: "Comments of a Product Hunt user, taken from their activity feed (comments filter), all pages. 1 point per returned record."
parameters:
  - name: user
    type: string
    required: true
    label:
      en_US: "User"
    human_description:
      en_US: "Username or Product Hunt profile URL. e.g. kevin"
    llm_description: "Username or Product Hunt profile URL. e.g. kevin"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_producthunt_users_comments.py
