identity:
  name: run_olx_users
  author: neuralverge
  label:
    en_US: "OLX user"
description:
  human:
    en_US: "Get an OLX seller profile by id, uuid or profile URL: account type, registration, last seen, response time and business details. 5 point per returned record."
  llm: "Get an OLX seller profile by id, uuid or profile URL: account type, registration, last seen, response time and business details. 5 point per returned record."
parameters:
  - name: domain
    type: select
    required: false
    label:
      en_US: "Domain"
    human_description:
      en_US: "Marketplace. Options: olx.pl = olx.pl (Poland), olx.ua = olx.ua (Ukraine), olx.ro = olx.ro (Romania), olx.bg = olx.bg (Bulgaria), olx.pt = olx.pt (Portugal), olx.kz = olx.kz (Kazakhstan), olx.uz = olx.uz (Uzbekistan) Default: olx.pl."
    llm_description: "Marketplace. Options: olx.pl = olx.pl (Poland), olx.ua = olx.ua (Ukraine), olx.ro = olx.ro (Romania), olx.bg = olx.bg (Bulgaria), olx.pt = olx.pt (Portugal), olx.kz = olx.kz (Kazakhstan), olx.uz = olx.uz (Uzbekistan) Default: olx.pl."
    form: llm
    options:
      - value: "olx.pl"
        label:
          en_US: "olx.pl"
      - value: "olx.ua"
        label:
          en_US: "olx.ua"
      - value: "olx.ro"
        label:
          en_US: "olx.ro"
      - value: "olx.bg"
        label:
          en_US: "olx.bg"
      - value: "olx.pt"
        label:
          en_US: "olx.pt"
      - value: "olx.kz"
        label:
          en_US: "olx.kz"
      - value: "olx.uz"
        label:
          en_US: "olx.uz"
  - name: user
    type: string
    required: true
    label:
      en_US: "User"
    human_description:
      en_US: "User. e.g. User id, uuid or profile URL, e.g. 888517085"
    llm_description: "User. e.g. User id, uuid or profile URL, e.g. 888517085"
    form: llm
extra:
  python:
    source: tools/run_olx_users.py
