identity:
  name: run_techeu_exits_search
  author: neuralverge
  label:
    en_US: "Tech.eu exits search"
description:
  human:
    en_US: "Search European startup exits and M&A (Tech.eu Funding Explorer, CC BY 4.0), newest first: company, date, type, value in EUR and acquirer. 1 point per returned record."
  llm: "Search European startup exits and M&A (Tech.eu Funding Explorer, CC BY 4.0), newest first: company, date, type, value in EUR and acquirer. 1 point per returned record."
parameters:
  - name: country
    type: string
    required: false
    label:
      en_US: "Country"
    human_description:
      en_US: "Country (e.g. Germany, UK, France). e.g. Germany"
    llm_description: "Country (e.g. Germany, UK, France). e.g. Germany"
    form: llm
  - name: from
    type: string
    required: false
    label:
      en_US: "From"
    human_description:
      en_US: "From date (YYYY-MM-DD). e.g. 2026-01-01"
    llm_description: "From date (YYYY-MM-DD). e.g. 2026-01-01"
    form: llm
  - name: to
    type: string
    required: false
    label:
      en_US: "To"
    human_description:
      en_US: "To date (YYYY-MM-DD). e.g. 2026-01-01"
    llm_description: "To date (YYYY-MM-DD). e.g. 2026-01-01"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_techeu_exits_search.py
