identity:
  name: run_leboncoin_listings_similar
  author: neuralverge
  label:
    en_US: "leboncoin Similar Listings"
description:
  human:
    en_US: "Get the 'annonces similaires' recommended for a leboncoin ad (by ID or URL): title, price, attributes, images, location and seller. 1 point per returned record."
  llm: "Get the 'annonces similaires' recommended for a leboncoin ad (by ID or URL): title, price, attributes, images, location and seller. 1 point per returned record."
parameters:
  - name: listing
    type: string
    required: true
    label:
      en_US: "Listing"
    human_description:
      en_US: "Ad ID or listing URL. e.g. 3188662248"
    llm_description: "Ad ID or listing URL. e.g. 3188662248"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 100) Default: 10."
    llm_description: "Max items (up to 100) Default: 10."
    form: llm
    min: 1
    max: 100
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_leboncoin_listings_similar.py
