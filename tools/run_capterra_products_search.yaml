identity:
  name: run_capterra_products_search
  author: neuralverge
  label:
    en_US: "Capterra products search"
description:
  human:
    en_US: "Search Capterra software products by keyword: name, rating, review count, and image. 1 point per returned record."
  llm: "Search Capterra software products by keyword: name, rating, review count, and image. 1 point per returned record."
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: "Query"
    human_description:
      en_US: "Search term. e.g. crm software"
    llm_description: "Search term. e.g. crm software"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
extra:
  python:
    source: tools/run_capterra_products_search.py
