identity:
  name: run_target_products_questions
  author: neuralverge
  label:
    en_US: "Target product questions"
description:
  human:
    en_US: "Customer questions and their answers for a Target product by TCIN or URL. 1 point per returned record."
  llm: "Customer questions and their answers for a Target product by TCIN or URL. 1 point per returned record."
parameters:
  - name: product
    type: string
    required: true
    label:
      en_US: "Product"
    human_description:
      en_US: "TCIN or product URL. e.g. 86216189"
    llm_description: "TCIN or product URL. e.g. 86216189"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_target_products_questions.py
