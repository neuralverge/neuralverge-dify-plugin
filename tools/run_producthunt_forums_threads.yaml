identity:
  name: run_producthunt_forums_threads
  author: neuralverge
  label:
    en_US: "Product Hunt forum thread comments"
description:
  human:
    en_US: "Top-level comments of a Product Hunt forum thread: text, author, votes, reply count and date, all pages. 1 point per returned record."
  llm: "Top-level comments of a Product Hunt forum thread: text, author, votes, reply count and date, all pages. 1 point per returned record."
parameters:
  - name: thread
    type: string
    required: true
    label:
      en_US: "Thread"
    human_description:
      en_US: "Thread URL or forum/thread-slug. e.g. general/how-do-you-decide-what-features-should-be-free-and-what-should-be-paid"
    llm_description: "Thread URL or forum/thread-slug. e.g. general/how-do-you-decide-what-features-should-be-free-and-what-should-be-paid"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_producthunt_forums_threads.py
