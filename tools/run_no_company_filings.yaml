identity:
  name: run_no_company_filings
  author: neuralverge
  label:
    en_US: "Norway company filings"
description:
  human:
    en_US: "List the registry announcements (Kunngjøringer) of a Norway company (Brønnøysundregistrene) by organisation number or registry URL, newest first: date, announcement type and link. 1 point per returned record."
  llm: "List the registry announcements (Kunngjøringer) of a Norway company (Brønnøysundregistrene) by organisation number or registry URL, newest first: date, announcement type and link. 1 point per returned record."
parameters:
  - name: company
    type: string
    required: true
    label:
      en_US: "Company"
    human_description:
      en_US: "Organisation number or registry URL. e.g. 923609016"
    llm_description: "Organisation number or registry URL. e.g. 923609016"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_no_company_filings.py
