identity:
  name: run_cz_company_filings
  author: neuralverge
  label:
    en_US: "Czech Republic company filings"
description:
  human:
    en_US: "List the documents filed in the Czech Republic Collection of Documents (Sbírka listin, Justice.cz) for one company, by IČO or registry URL, newest first: document number, type, description, period, filing dates, pages and link. 1 point per returned record."
  llm: "List the documents filed in the Czech Republic Collection of Documents (Sbírka listin, Justice.cz) for one company, by IČO or registry URL, newest first: document number, type, description, period, filing dates, pages and link. 1 point per returned record."
parameters:
  - name: company
    type: string
    required: true
    label:
      en_US: "Company"
    human_description:
      en_US: "IČO or registry URL. e.g. 00177041"
    llm_description: "IČO or registry URL. e.g. 00177041"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_cz_company_filings.py
