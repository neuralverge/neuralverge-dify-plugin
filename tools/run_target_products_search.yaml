identity:
  name: run_target_products_search
  author: neuralverge
  label:
    en_US: "Target products search"
description:
  human:
    en_US: "Search live Target products by keyword with a sort order (relevance, featured, price, rating, bestselling, newest). 1 point per returned record."
  llm: "Search live Target products by keyword with a sort order (relevance, featured, price, rating, bestselling, newest). 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Search term. e.g. lego"
    llm_description: "Search term. e.g. lego"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
  - name: sort
    type: select
    required: false
    label:
      en_US: "Sort"
    human_description:
      en_US: "Sort by. Options: relevance = Relevance, featured = Featured, price_low = Price: low to high, price_high = Price: high to low, rating = Highest rated, bestselling = Best selling, newest = Newest"
    llm_description: "Sort by. Options: relevance = Relevance, featured = Featured, price_low = Price: low to high, price_high = Price: high to low, rating = Highest rated, bestselling = Best selling, newest = Newest"
    form: llm
    options:
      - value: "relevance"
        label:
          en_US: "relevance"
      - value: "featured"
        label:
          en_US: "featured"
      - value: "price_low"
        label:
          en_US: "price_low"
      - value: "price_high"
        label:
          en_US: "price_high"
      - value: "rating"
        label:
          en_US: "rating"
      - value: "bestselling"
        label:
          en_US: "bestselling"
      - value: "newest"
        label:
          en_US: "newest"
extra:
  python:
    source: tools/run_target_products_search.py
