identity:
  name: run_pl_companies_search
  author: neuralverge
  label:
    en_US: "Poland companies search"
description:
  human:
    en_US: "Search the Poland company registry (KRS) by company name: name, KRS number, city, register and flags. 1 point per returned record."
  llm: "Search the Poland company registry (KRS) by company name: name, KRS number, city, register and flags. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Company name. e.g. orlen"
    llm_description: "Company name. e.g. orlen"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 100) Default: 25."
    llm_description: "Max items (up to 100) Default: 25."
    form: llm
    min: 1
    max: 100
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_pl_companies_search.py
