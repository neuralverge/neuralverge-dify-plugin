identity:
  name: run_walmart_seller_products
  author: neuralverge
  label:
    en_US: "Walmart seller products"
description:
  human:
    en_US: "List products from a Walmart seller's storefront: title, price, rating, and availability. 1 point per returned record."
  llm: "List products from a Walmart seller's storefront: title, price, rating, and availability. 1 point per returned record."
parameters:
  - name: seller
    type: string
    required: true
    label:
      en_US: "Seller"
    human_description:
      en_US: "Walmart storefront catalogSellerId (numeric, e.g. 102730552) or a storefront URL containing it. Not the 32-character sellerId hash from product pages and search results: that hash has no storefront page and cannot be converted. Read the id from run-walmart-product's machine.product.seller.storefront_url for any item this seller offers — items sold by Walmart itself (seller.type INTERNAL) have no storefront, so the field is null for those."
    llm_description: "Walmart storefront catalogSellerId (numeric, e.g. 102730552) or a storefront URL containing it. Not the 32-character sellerId hash from product pages and search results: that hash has no storefront page and cannot be converted. Read the id from run-walmart-product's machine.product.seller.storefront_url for any item this seller offers — items sold by Walmart itself (seller.type INTERNAL) have no storefront, so the field is null for those."
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 10."
    llm_description: "Max items (up to 250) Default: 10."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_walmart_seller_products.py
