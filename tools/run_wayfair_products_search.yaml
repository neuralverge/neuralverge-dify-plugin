identity:
  name: run_wayfair_products_search
  author: neuralverge
  label:
    en_US: "Wayfair Products Search"
description:
  human:
    en_US: "Search Wayfair products by keyword. Returns products with title, brand, price, list price, currency, discount, rating, review count and images. 1 point per returned record."
  llm: "Search Wayfair products by keyword. Returns products with title, brand, price, list price, currency, discount, rating, review count and images. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Search term. e.g. velvet accent chair"
    llm_description: "Search term. e.g. velvet accent chair"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 300) Default: 25."
    llm_description: "Max items (up to 300) Default: 25."
    form: llm
    min: 1
    max: 300
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_wayfair_products_search.py
