identity:
  name: run_wellfound_locations
  author: neuralverge
  label:
    en_US: "Wellfound locations"
description:
  human:
    en_US: "The list of Wellfound job locations (US cities, US states, countries and other places) with the slug to use as the location in Wellfound jobs search. Optional type and name filters. Flat 5 points per successful run."
  llm: "The list of Wellfound job locations (US cities, US states, countries and other places) with the slug to use as the location in Wellfound jobs search. Optional type and name filters. Flat 5 points per successful run."
parameters:
  - name: keyword
    type: string
    required: false
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Name contains. e.g. york"
    llm_description: "Name contains. e.g. york"
    form: llm
  - name: type
    type: select
    required: false
    label:
      en_US: "Type"
    human_description:
      en_US: "Type. Options: city = US city, state = US state, other = Other (countries, regions, non-US cities)"
    llm_description: "Type. Options: city = US city, state = US state, other = Other (countries, regions, non-US cities)"
    form: llm
    options:
      - value: "city"
        label:
          en_US: "city"
      - value: "state"
        label:
          en_US: "state"
      - value: "other"
        label:
          en_US: "other"
extra:
  python:
    source: tools/run_wellfound_locations.py
