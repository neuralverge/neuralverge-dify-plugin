identity:
  name: run_poshmark_items
  author: neuralverge
  label:
    en_US: "Poshmark item"
description:
  human:
    en_US: "Get one Poshmark listing by id or URL: price, brand, size, colors, category, photos, likes/comments, seller and the likers/comments shown on the page. Flat 5 points per successful run."
  llm: "Get one Poshmark listing by id or URL: price, brand, size, colors, category, photos, likes/comments, seller and the likers/comments shown on the page. Flat 5 points per successful run."
parameters:
  - name: item
    type: string
    required: true
    label:
      en_US: "Item"
    human_description:
      en_US: "Listing. e.g. Listing id or URL, e.g. 6865651dd6c0dc3f3fdfc8ea"
    llm_description: "Listing. e.g. Listing id or URL, e.g. 6865651dd6c0dc3f3fdfc8ea"
    form: llm
  - name: domain
    type: select
    required: false
    label:
      en_US: "Domain"
    human_description:
      en_US: "Domain. Options: poshmark.com = poshmark.com, poshmark.ca = poshmark.ca Default: poshmark.com."
    llm_description: "Domain. Options: poshmark.com = poshmark.com, poshmark.ca = poshmark.ca Default: poshmark.com."
    form: llm
    options:
      - value: "poshmark.com"
        label:
          en_US: "poshmark.com"
      - value: "poshmark.ca"
        label:
          en_US: "poshmark.ca"
extra:
  python:
    source: tools/run_poshmark_items.py
