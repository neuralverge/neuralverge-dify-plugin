identity:
  name: run_trustpilot_search
  author: neuralverge
  label:
    en_US: "Trustpilot search"
description:
  human:
    en_US: "Search Trustpilot businesses by keyword: name, domain, rating, and review count. 1 point per returned record."
  llm: "Search Trustpilot businesses by keyword: name, domain, rating, and review count. 1 point per returned record."
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: "Query"
    human_description:
      en_US: "Search term. e.g. hubspot"
    llm_description: "Search term. e.g. hubspot"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 300) Default: 25."
    llm_description: "Max items (up to 300) Default: 25."
    form: llm
    min: 1
    max: 300
extra:
  python:
    source: tools/run_trustpilot_search.py
