identity:
  name: run_flipkart_product_search
  author: neuralverge
  label:
    en_US: "Flipkart Product Search"
description:
  human:
    en_US: "Search Flipkart products by keyword: id, title, brand, price, MRP, discount, image, key specs, rating and review counts. 1 point per returned record."
  llm: "Search Flipkart products by keyword: id, title, brand, price, MRP, discount, image, key specs, rating and review counts. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Search term. e.g. wireless earbuds"
    llm_description: "Search term. e.g. wireless earbuds"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_flipkart_product_search.py
