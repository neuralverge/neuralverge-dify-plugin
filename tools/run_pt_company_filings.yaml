identity:
  name: run_pt_company_filings
  author: neuralverge
  label:
    en_US: "Portugal company filings"
description:
  human:
    en_US: "List the publications of a Portugal company (Registo Comercial publications portal) by NIF/NIPC or registry link, newest first: date, act type (registry acts, accounts deposits, notices, convocations), municipality and whether a text / attachment exists. 2 point per returned record."
  llm: "List the publications of a Portugal company (Registo Comercial publications portal) by NIF/NIPC or registry link, newest first: date, act type (registry acts, accounts deposits, notices, convocations), municipality and whether a text / attachment exists. 2 point per returned record."
parameters:
  - name: company
    type: string
    required: true
    label:
      en_US: "Company"
    human_description:
      en_US: "NIF/NIPC or registry URL. e.g. 500697256"
    llm_description: "NIF/NIPC or registry URL. e.g. 500697256"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page (80 publications per page)"
    llm_description: "Starting page (80 publications per page)"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_pt_company_filings.py
