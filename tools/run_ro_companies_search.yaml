identity:
  name: run_ro_companies_search
  author: neuralverge
  label:
    en_US: "Romania companies search"
description:
  human:
    en_US: "Search the Romania company registry (Ministry of Finance / ONRC data) by company name: name and CUI. Bucharest by default, add \"@ cluj\" (county name or code) to the keyword to search another county. All words must appear in the name. 1 point per returned record."
  llm: "Search the Romania company registry (Ministry of Finance / ONRC data) by company name: name and CUI. Bucharest by default, add \"@ cluj\" (county name or code) to the keyword to search another county. All words must appear in the name. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Company name (optionally @ county). e.g. dedeman"
    llm_description: "Company name (optionally @ county). e.g. dedeman"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_ro_companies_search.py
