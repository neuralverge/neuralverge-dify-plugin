  author: neuralverge
  label:
    en_US: "Dealroom investors search"
description:
  human:
    en_US: "Search the Dealroom investor index by name keyword, type and country, ordered by Dealroom rank: name, type, country, HQ, portfolio companies, rank and link. With no filters it returns the top of the index. 1 point per returned record."
