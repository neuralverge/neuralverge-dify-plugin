identity:
  name: run_indiehackers_posts
  author: neuralverge
  label:
    en_US: "Indie Hackers post"
description:
  human:
    en_US: "Get one Indie Hackers post by its slug or URL: title, full text, author, publish date, upvotes, comment count and the product it belongs to. Flat 5 points per successful run."
  llm: "Get one Indie Hackers post by its slug or URL: title, full text, author, publish date, upvotes, comment count and the product it belongs to. Flat 5 points per successful run."
parameters:
  - name: post
    type: string
    required: true
    label:
      en_US: "Post"
    human_description:
      en_US: "Post slug or Indie Hackers URL. e.g. i-built-a-git-host-where-ai-agents-dont-need-accounts-1dca7d2ac4"
    llm_description: "Post slug or Indie Hackers URL. e.g. i-built-a-git-host-where-ai-agents-dont-need-accounts-1dca7d2ac4"
    form: llm
extra:
  python:
    source: tools/run_indiehackers_posts.py
