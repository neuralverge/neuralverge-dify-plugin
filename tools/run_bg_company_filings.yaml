identity:
  name: run_bg_company_filings
  author: neuralverge
  label:
    en_US: "Bulgaria company filings"
description:
  human:
    en_US: "List the announced acts of a Bulgaria company (Commercial Register) by UIC (ЕИК) or registry URL, newest first: announcement date, act type, title and document link (annual reports, notices, reports, current articles). 1 point per returned record."
  llm: "List the announced acts of a Bulgaria company (Commercial Register) by UIC (ЕИК) or registry URL, newest first: announcement date, act type, title and document link (annual reports, notices, reports, current articles). 1 point per returned record."
parameters:
  - name: company
    type: string
    required: true
    label:
      en_US: "Company"
    human_description:
      en_US: "UIC (ЕИК) or registry URL. e.g. 831902088"
    llm_description: "UIC (ЕИК) or registry URL. e.g. 831902088"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_bg_company_filings.py
