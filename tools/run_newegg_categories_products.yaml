identity:
  name: run_newegg_categories_products
  author: neuralverge
  label:
    en_US: "Newegg category products"
description:
  human:
    en_US: "Products in a Newegg category by category id or category page URL: price, rating, seller and stock, with sort. 1 point per returned record."
  llm: "Products in a Newegg category by category id or category page URL: price, rating, seller and stock, with sort. 1 point per returned record."
parameters:
  - name: category
    type: string
    required: true
    label:
      en_US: "Category"
    human_description:
      en_US: "Category. e.g. 100011693"
    llm_description: "Category. e.g. 100011693"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
  - name: sort
    type: select
    required: false
    label:
      en_US: "Sort"
    human_description:
      en_US: "Sort by. Options: 1 = Lowest price, 2 = Highest price, 3 = Best selling, 4 = Best rating, 5 = Most reviews"
    llm_description: "Sort by. Options: 1 = Lowest price, 2 = Highest price, 3 = Best selling, 4 = Best rating, 5 = Most reviews"
    form: llm
    options:
      - value: "1"
        label:
          en_US: "1"
      - value: "2"
        label:
          en_US: "2"
      - value: "3"
        label:
          en_US: "3"
      - value: "4"
        label:
          en_US: "4"
      - value: "5"
        label:
          en_US: "5"
extra:
  python:
    source: tools/run_newegg_categories_products.py
