identity:
  name: run_yahoo_auctions_items_search
  author: neuralverge
  label:
    en_US: "Yahoo! Auctions items search"
description:
  human:
    en_US: "Search live Yahoo! Auctions Japan listings by keyword and/or category with price, buy-it-now, condition, region, seller, listing-type, appraisal, shipping filters and sort. 1 point per returned record."
  llm: "Search live Yahoo! Auctions Japan listings by keyword and/or category with price, buy-it-now, condition, region, seller, listing-type, appraisal, shipping filters and sort. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: false
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Search term (optional when a category is set). e.g. rolex"
    llm_description: "Search term (optional when a category is set). e.g. rolex"
    form: llm
  - name: keyword_exclude
    type: string
    required: false
    label:
      en_US: "Keyword exclude"
    human_description:
      en_US: "Excluded words (space-separated, needs a search term). e.g. box case"
    llm_description: "Excluded words (space-separated, needs a search term). e.g. box case"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 0
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 0
    max: 9007199254740991
  - name: sort
    type: select
    required: false
    label:
      en_US: "Sort"
