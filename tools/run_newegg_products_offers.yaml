identity:
  name: run_newegg_products_offers
  author: neuralverge
  label:
    en_US: "Newegg product offers"
description:
  human:
    en_US: "Every marketplace buying option for a Newegg product: seller, price, shipping, condition and ships-from. 1 point per returned record."
  llm: "Every marketplace buying option for a Newegg product: seller, price, shipping, condition and ships-from. 1 point per returned record."
parameters:
  - name: product
    type: string
    required: true
    label:
      en_US: "Product"
    human_description:
      en_US: "Item number or URL. e.g. N82E16820147903"
    llm_description: "Item number or URL. e.g. N82E16820147903"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 10."
    llm_description: "Max items (up to 500) Default: 10."
    form: llm
    min: 1
    max: 500
extra:
  python:
    source: tools/run_newegg_products_offers.py
