identity:
  name: run_trendyol_products_reviews
  author: neuralverge
  label:
    en_US: "Trendyol product reviews"
description:
  human:
    en_US: "Customer reviews for a Trendyol product by contentId or URL: rating, text, author, date, likes, seller and photos. 1 point per returned record."
  llm: "Customer reviews for a Trendyol product by contentId or URL: rating, text, author, date, likes, seller and photos. 1 point per returned record."
parameters:
  - name: product
    type: string
    required: true
    label:
      en_US: "Product"
    human_description:
      en_US: "Product ID or URL. e.g. 689227641"
    llm_description: "Product ID or URL. e.g. 689227641"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_trendyol_products_reviews.py
