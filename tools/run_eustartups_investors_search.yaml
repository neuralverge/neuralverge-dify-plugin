identity:
  name: run_eustartups_investors_search
  author: neuralverge
  label:
    en_US: "EU-Startups investors search"
description:
  human:
    en_US: "Search the EU-Startups investor database by name, type and HQ country: type, HQ, investment areas, typical investment, funding stage and link. All filters are optional. 1 point per returned record."
  llm: "Search the EU-Startups investor database by name, type and HQ country: type, HQ, investment areas, typical investment, funding stage and link. All filters are optional. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: false
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Investor name. e.g. capital"
    llm_description: "Investor name. e.g. capital"
    form: llm
  - name: type
    type: select
    required: false
    label:
      en_US: "Type"
    human_description:
      en_US: "Investor type. Options: vc = VC firm, accelerator = Accelerator, corporate = Corporate VC"
    llm_description: "Investor type. Options: vc = VC firm, accelerator = Accelerator, corporate = Corporate VC"
    form: llm
    options:
      - value: "vc"
        label:
          en_US: "vc"
      - value: "accelerator"
        label:
          en_US: "accelerator"
      - value: "corporate"
        label:
          en_US: "corporate"
  - name: country
    type: string
    required: false
    label:
      en_US: "Country"
    human_description:
      en_US: "HQ country (ISO-2). e.g. DE"
    llm_description: "HQ country (ISO-2). e.g. DE"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_eustartups_investors_search.py
