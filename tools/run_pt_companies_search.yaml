identity:
  name: run_pt_companies_search
  author: neuralverge
  label:
    en_US: "Portugal companies search"
description:
  human:
    en_US: "Search the Portugal company registry (Registo Comercial publications portal) by entity name: name, NIF/NIPC, municipality and the date and type of the newest publication. 2 point per returned record."
  llm: "Search the Portugal company registry (Registo Comercial publications portal) by entity name: name, NIF/NIPC, municipality and the date and type of the newest publication. 2 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Company name. e.g. padaria"
    llm_description: "Company name. e.g. padaria"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page (25 companies per page)"
    llm_description: "Starting page (25 companies per page)"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_pt_companies_search.py
