identity:
  name: run_walmart_product_reviews
  author: neuralverge
  label:
    en_US: "Walmart product reviews"
description:
  human:
    en_US: "Get customer reviews for a Walmart product by item ID: rating, text, and author. 1 point per returned record."
  llm: "Get customer reviews for a Walmart product by item ID: rating, text, and author. 1 point per returned record."
parameters:
  - name: product
    type: string
    required: true
    label:
      en_US: "Product"
    human_description:
      en_US: "Item ID or URL. e.g. 15545702811"
    llm_description: "Item ID or URL. e.g. 15545702811"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 10."
    llm_description: "Max items (up to 250) Default: 10."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_walmart_product_reviews.py
