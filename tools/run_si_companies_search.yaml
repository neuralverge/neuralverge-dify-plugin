identity:
  name: run_si_companies_search
  author: neuralverge
  label:
    en_US: "Slovenia companies search"
description:
  human:
    en_US: "Search the Slovenia company registry (AJPES PRS) by company name: name, short name, registration number (matična številka), status (active/deleted), address, tax/VAT number and link. 1 point per returned record."
  llm: "Search the Slovenia company registry (AJPES PRS) by company name: name, short name, registration number (matična številka), status (active/deleted), address, tax/VAT number and link. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Company name. e.g. krka"
    llm_description: "Company name. e.g. krka"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 100) Default: 25."
    llm_description: "Max items (up to 100) Default: 25."
    form: llm
    min: 1
    max: 100
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 5
  - name: status
    type: select
    required: false
    label:
      en_US: "Status"
    human_description:
      en_US: "Status. Options: active = Active, inactive = Inactive / dissolved"
    llm_description: "Status. Options: active = Active, inactive = Inactive / dissolved"
    form: llm
    options:
      - value: "active"
        label:
          en_US: "active"
      - value: "inactive"
        label:
          en_US: "inactive"
extra:
  python:
    source: tools/run_si_companies_search.py
