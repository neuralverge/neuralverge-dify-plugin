identity:
  name: run_producthunt_collections
  author: neuralverge
  label:
    en_US: "Product Hunt collection products"
description:
  human:
    en_US: "Products of a Product Hunt collection in the curator's order, with the full list paged beyond the first 20. 1 point per returned record."
  llm: "Products of a Product Hunt collection in the curator's order, with the full list paged beyond the first 20. 1 point per returned record."
parameters:
  - name: collection
    type: string
    required: true
    label:
      en_US: "Collection"
    human_description:
      en_US: "Collection slug or Product Hunt URL. e.g. 0-design-tools"
    llm_description: "Collection slug or Product Hunt URL. e.g. 0-design-tools"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_producthunt_collections.py
