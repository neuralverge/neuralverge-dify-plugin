identity:
  name: run_ebay_seller_items
  author: neuralverge
  label:
    en_US: "eBay seller items"
description:
  human:
    en_US: "List active eBay listings for a seller: title, price, condition, and image. 1 point per returned record."
  llm: "List active eBay listings for a seller: title, price, condition, and image. 1 point per returned record."
parameters:
  - name: seller
    type: string
    required: true
    label:
      en_US: "Seller"
    human_description:
      en_US: "Username or store URL. e.g. cocosmartphones"
    llm_description: "Username or store URL. e.g. cocosmartphones"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 10."
    llm_description: "Max items (up to 500) Default: 10."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_ebay_seller_items.py
