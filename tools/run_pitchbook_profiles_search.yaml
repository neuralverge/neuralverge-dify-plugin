identity:
  name: run_pitchbook_profiles_search
  author: neuralverge
  label:
    en_US: "PitchBook profile search"
description:
  human:
    en_US: "Search PitchBook public profile previews by keyword: name, type (company / investor / fund), profile id and link. 1 point per returned record."
  llm: "Search PitchBook public profile previews by keyword: name, type (company / investor / fund), profile id and link. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Keyword. e.g. stripe"
    llm_description: "Keyword. e.g. stripe"
    form: llm
  - name: type
    type: select
    required: false
    label:
      en_US: "Type"
    human_description:
      en_US: "Profile type. Options: company = Company, investor = Investor, fund = Fund"
    llm_description: "Profile type. Options: company = Company, investor = Investor, fund = Fund"
    form: llm
    options:
      - value: "company"
        label:
          en_US: "company"
      - value: "investor"
        label:
          en_US: "investor"
      - value: "fund"
        label:
          en_US: "fund"
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_pitchbook_profiles_search.py
