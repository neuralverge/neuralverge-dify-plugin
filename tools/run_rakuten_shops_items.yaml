identity:
  name: run_rakuten_shops_items
  author: neuralverge
  label:
    en_US: "Rakuten shop items"
description:
  human:
    en_US: "The item catalog of a Rakuten Ichiba shop by shop_code or URL: title, price range, image, points, shipping, rating, category. 1 point per returned record."
  llm: "The item catalog of a Rakuten Ichiba shop by shop_code or URL: title, price range, image, points, shipping, rating, category. 1 point per returned record."
parameters:
  - name: shop
    type: string
    required: true
    label:
      en_US: "Shop"
    human_description:
      en_US: "Shop code or URL. e.g. sawaicoffee-tea"
    llm_description: "Shop code or URL. e.g. sawaicoffee-tea"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 10."
    llm_description: "Max items (up to 500) Default: 10."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_rakuten_shops_items.py
