identity:
  name: run_yahoo_auctions_items_closed_search
  author: neuralverge
  label:
    en_US: "Yahoo! Auctions closed items search"
description:
  human:
    en_US: "Search completed Yahoo! Auctions Japan auctions by keyword and see the price each item actually sold for, with sold-price, condition, region, seller-type and sort filters. 1 point per returned record."
  llm: "Search completed Yahoo! Auctions Japan auctions by keyword and see the price each item actually sold for, with sold-price, condition, region, seller-type and sort filters. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Search term. e.g. rolex"
    llm_description: "Search term. e.g. rolex"
    form: llm
  - name: keyword_exclude
    type: string
    required: false
    label:
      en_US: "Keyword exclude"
    human_description:
      en_US: "Excluded words (space-separated). e.g. box case"
    llm_description: "Excluded words (space-separated). e.g. box case"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 0
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 0
    max: 9007199254740991
  - name: sort
    type: select
    required: false
    label:
      en_US: "Sort"
    human_description:
      en_US: "Sort by. Options: ended_recent = Recently ended, ended_oldest = Oldest ended, price_asc = Sold price: low to high, price_desc = Sold price: high to low, bids_desc = Most bids, bids_asc = Fewest bids, popular = Popular, featured = Featured"
    llm_description: "Sort by. Options: ended_recent = Recently ended, ended_oldest = Oldest ended, price_asc = Sold price: low to high, price_desc = Sold price: high to low, bids_desc = Most bids, bids_asc = Fewest bids, popular = Popular, featured = Featured"
