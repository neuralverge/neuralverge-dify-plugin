identity:
  name: run_poshmark_items_comments
  author: neuralverge
  label:
    en_US: "Poshmark item comments"
description:
  human:
    en_US: "Comments on a Poshmark listing (author, text, date), by listing id or URL. 1 point per returned record."
  llm: "Comments on a Poshmark listing (author, text, date), by listing id or URL. 1 point per returned record."
parameters:
  - name: item
    type: string
    required: true
    label:
      en_US: "Item"
    human_description:
      en_US: "Listing. e.g. Listing id or URL, e.g. 6865651dd6c0dc3f3fdfc8ea"
    llm_description: "Listing. e.g. Listing id or URL, e.g. 6865651dd6c0dc3f3fdfc8ea"
    form: llm
  - name: domain
    type: select
    required: false
    label:
      en_US: "Domain"
    human_description:
      en_US: "Domain. Options: poshmark.com = poshmark.com, poshmark.ca = poshmark.ca Default: poshmark.com."
    llm_description: "Domain. Options: poshmark.com = poshmark.com, poshmark.ca = poshmark.ca Default: poshmark.com."
    form: llm
    options:
      - value: "poshmark.com"
        label:
          en_US: "poshmark.com"
      - value: "poshmark.ca"
        label:
          en_US: "poshmark.ca"
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max comments (up to 500) Default: 25."
    llm_description: "Max comments (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
extra:
  python:
    source: tools/run_poshmark_items_comments.py
