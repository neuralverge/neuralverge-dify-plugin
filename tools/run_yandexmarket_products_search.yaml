identity:
  name: run_yandexmarket_products_search
  author: neuralverge
  label:
    en_US: "Yandex Market products search"
description:
  human:
    en_US: "Search Yandex Market products by keyword with sort, price, condition, payment, rating, brand and seller filters. 1 point per returned record."
  llm: "Search Yandex Market products by keyword with sort, price, condition, payment, rating, brand and seller filters. 1 point per returned record."
parameters:
  - name: text
    type: string
    required: true
    label:
      en_US: "Text"
    human_description:
      en_US: "Search term. e.g. iphone 15"
    llm_description: "Search term. e.g. iphone 15"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
  - name: sort
    type: select
    required: false
    label:
      en_US: "Sort"
    human_description:
      en_US: "Sort by. Options: dpop = Popularity, aprice = Price: low to high, dprice = Price: high to low, rating = Rating, date = Newest, discount_p = Biggest discount"
    llm_description: "Sort by. Options: dpop = Popularity, aprice = Price: low to high, dprice = Price: high to low, rating = Rating, date = Newest, discount_p = Biggest discount"
    form: llm
    options:
      - value: "dpop"
        label:
          en_US: "dpop"
      - value: "aprice"
        label:
          en_US: "aprice"
      - value: "dprice"
        label:
          en_US: "dprice"
      - value: "rating"
        label:
          en_US: "rating"
      - value: "date"
        label:
          en_US: "date"
      - value: "discount_p"
        label:
          en_US: "discount_p"
  - name: condition
    type: select
    required: false
    label:
      en_US: "Condition"
    human_description:
      en_US: "Condition. Options: new = New, resale = Resale / used"
    llm_description: "Condition. Options: new = New, resale = Resale / used"
    form: llm
    options:
      - value: "new"
        label:
          en_US: "new"
      - value: "resale"
        label:
          en_US: "resale"
  - name: price_min
    type: number
    required: false
    label:
      en_US: "Price min"
    human_description:
      en_US: "Min price (RUB)"
    llm_description: "Min price (RUB)"
    form: llm
  - name: price_max
    type: number
    required: false
    label:
      en_US: "Price max"
    human_description:
      en_US: "Max price (RUB)"
    llm_description: "Max price (RUB)"
    form: llm
  - name: payment
    type: select
    required: false
    label:
      en_US: "Payment"
    human_description:
      en_US: "Payment method. Options: online = Online, card_courier = Card to courier, cash_courier = Cash to courier, postpaid_pickup = Pay at pickup point"
    llm_description: "Payment method. Options: online = Online, card_courier = Card to courier, cash_courier = Cash to courier, postpaid_pickup = Pay at pickup point"
    form: llm
    options:
      - value: "online"
        label:
          en_US: "online"
      - value: "card_courier"
        label:
          en_US: "card_courier"
      - value: "cash_courier"
        label:
          en_US: "cash_courier"
      - value: "postpaid_pickup"
        label:
          en_US: "postpaid_pickup"
  - name: high_rating
    type: boolean
    required: false
    label:
      en_US: "High rating"
    human_description:
      en_US: "Highly rated only"
    llm_description: "Highly rated only"
    form: llm
  - name: vendor_id
    type: number
    required: false
    label:
      en_US: "Vendor id"
    human_description:
      en_US: "Brand (vendor ID)"
    llm_description: "Brand (vendor ID)"
    form: llm
  - name: business_id
    type: number
    required: false
    label:
      en_US: "Business id"
    human_description:
      en_US: "Seller (business ID)"
    llm_description: "Seller (business ID)"
    form: llm
extra:
  python:
    source: tools/run_yandexmarket_products_search.py
