identity:
  name: run_shopify_collections_products
  author: neuralverge
  label:
    en_US: "Shopify collection products"
description:
  human:
    en_US: "Products of a Shopify collection with options, variants, prices and availability. 1 point per returned record."
  llm: "Products of a Shopify collection with options, variants, prices and availability. 1 point per returned record."
parameters:
  - name: store_domain
    type: string
    required: true
    label:
      en_US: "Store domain"
    human_description:
      en_US: "Store domain. e.g. gymshark.com"
    llm_description: "Store domain. e.g. gymshark.com"
    form: llm
  - name: collection
    type: string
    required: true
    label:
      en_US: "Collection"
    human_description:
      en_US: "Collection handle or URL. e.g. mens"
    llm_description: "Collection handle or URL. e.g. mens"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_shopify_collections_products.py
