identity:
  name: run_dealroom_companies_search
  author: neuralverge
  label:
    en_US: "Dealroom companies search"
description:
  human:
    en_US: "Search Dealroom companies by keyword and/or tier, sector and country: name, tier, sector, HQ, founding year, numeric valuation and range, logo and link. At least one of keyword / tier / sector / country is required. 1 point per returned record."
  llm: "Search Dealroom companies by keyword and/or tier, sector and country: name, tier, sector, HQ, founding year, numeric valuation and range, logo and link. At least one of keyword / tier / sector / country is required. 1 point per returned record."
