    type: string
    required: false
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Keyword. e.g. revolut"
    llm_description: "Keyword. e.g. revolut"
    form: llm
  - name: tier
    type: select
    required: false
    label:
      en_US: "Tier"
    human_description:
      en_US: "Tier. Options: Centicorn = Centicorn, Colt = Colt, Decacorn = Decacorn, Gigacorn = Gigacorn, Listed = Listed, Mag 7 = Mag 7, Thoroughbred = Thoroughbred, Titan = Titan, Unicorn = Unicorn"
