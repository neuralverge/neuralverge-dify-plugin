identity:
  name: run_poshmark_users_search
  author: neuralverge
  label:
    en_US: "Poshmark users search"
description:
  human:
    en_US: "Search Poshmark closets by name or handle (username, name, avatar, home region). 1 point per returned record."
  llm: "Search Poshmark closets by name or handle (username, name, avatar, home region). 1 point per returned record."
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: "Query"
    human_description:
      en_US: "Name or handle. e.g. najescloset"
    llm_description: "Name or handle. e.g. najescloset"
    form: llm
  - name: domain
    type: select
    required: false
    label:
      en_US: "Domain"
    human_description:
      en_US: "Domain. Options: poshmark.com = poshmark.com, poshmark.ca = poshmark.ca Default: poshmark.com."
    llm_description: "Domain. Options: poshmark.com = poshmark.com, poshmark.ca = poshmark.ca Default: poshmark.com."
    form: llm
    options:
      - value: "poshmark.com"
        label:
          en_US: "poshmark.com"
      - value: "poshmark.ca"
        label:
          en_US: "poshmark.ca"
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 500) Default: 25."
    llm_description: "Max items (up to 500) Default: 25."
    form: llm
    min: 1
    max: 500
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_poshmark_users_search.py
