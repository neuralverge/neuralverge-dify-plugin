identity:
  name: run_indiehackers_posts_comments
  author: neuralverge
  label:
    en_US: "Indie Hackers post comments"
description:
  human:
    en_US: "List the comments of one Indie Hackers post (threaded: depth and parent id): text, author, upvotes and date. 1 point per returned record."
  llm: "List the comments of one Indie Hackers post (threaded: depth and parent id): text, author, upvotes and date. 1 point per returned record."
parameters:
  - name: post
    type: string
    required: true
    label:
      en_US: "Post"
    human_description:
      en_US: "Post slug or Indie Hackers URL. e.g. 3-products-0-revenue-i-think-i-finally-understand-the-problem-6509e1a76a"
    llm_description: "Post slug or Indie Hackers URL. e.g. 3-products-0-revenue-i-think-i-finally-understand-the-problem-6509e1a76a"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page (50 comments per page)"
    llm_description: "Starting page (50 comments per page)"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_indiehackers_posts_comments.py
