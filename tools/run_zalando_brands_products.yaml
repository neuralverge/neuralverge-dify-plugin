identity:
  name: run_zalando_brands_products
  author: neuralverge
  label:
    en_US: "Zalando Brand Products"
description:
  human:
    en_US: "Get products of a Zalando brand by brand alias or brand page URL: name, brand, price, list price, discount, currency, image, silhouette, gender, flags and sizes. 1 point per returned record."
  llm: "Get products of a Zalando brand by brand alias or brand page URL: name, brand, price, list price, discount, currency, image, silhouette, gender, flags and sizes. 1 point per returned record."
parameters:
  - name: brand
    type: string
    required: true
    label:
      en_US: "Brand"
    human_description:
      en_US: "Brand alias or brand page URL. e.g. nike-sportswear"
    llm_description: "Brand alias or brand page URL. e.g. nike-sportswear"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 300) Default: 10."
    llm_description: "Max items (up to 300) Default: 10."
    form: llm
    min: 1
    max: 300
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_zalando_brands_products.py
