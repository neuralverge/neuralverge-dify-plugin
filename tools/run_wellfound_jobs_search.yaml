identity:
  name: run_wellfound_jobs_search
  author: neuralverge
  label:
    en_US: "Wellfound jobs search"
description:
  human:
    en_US: "Search Wellfound jobs by role and location: job title, pay, locations, description and the hiring company (size, stage, tags). 1 point per returned record."
  llm: "Search Wellfound jobs by role and location: job title, pay, locations, description and the hiring company (size, stage, tags). 1 point per returned record."
parameters:
  - name: role
    type: string
    required: true
    label:
      en_US: "Role"
    human_description:
      en_US: "Role (slug). e.g. software-engineer"
    llm_description: "Role (slug). e.g. software-engineer"
    form: llm
  - name: location
    type: string
    required: true
    label:
      en_US: "Location"
    human_description:
      en_US: "Location (slug). e.g. san-francisco"
    llm_description: "Location (slug). e.g. san-francisco"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_wellfound_jobs_search.py
