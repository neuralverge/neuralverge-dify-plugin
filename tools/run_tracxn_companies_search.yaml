identity:
  name: run_tracxn_companies_search
  author: neuralverge
  label:
    en_US: "Tracxn companies list"
description:
  human:
    en_US: "Get the companies of a Tracxn list page (an explore list such as Auto Tech startups in India, or a sector /companies page): name, description, founded year, location, stage, total funding, investors, Tracxn score, competitor rank. 1 point per returned record."
  llm: "Get the companies of a Tracxn list page (an explore list such as Auto Tech startups in India, or a sector /companies page): name, description, founded year, location, stage, total funding, investors, Tracxn score, competitor rank. 1 point per returned record."
parameters:
  - name: explore
    type: string
    required: true
    label:
      en_US: "Explore"
    human_description:
      en_US: "Tracxn list URL or id token. e.g. https://tracxn.com/d/explore/auto-tech-startups-in-india/__hVMq_SvfouSavYtGTT238hkb4bpf6AxJKMZXgXripxA"
    llm_description: "Tracxn list URL or id token. e.g. https://tracxn.com/d/explore/auto-tech-startups-in-india/__hVMq_SvfouSavYtGTT238hkb4bpf6AxJKMZXgXripxA"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 5) Default: 5."
    llm_description: "Max items (up to 5) Default: 5."
    form: llm
    min: 1
    max: 5
extra:
  python:
    source: tools/run_tracxn_companies_search.py
