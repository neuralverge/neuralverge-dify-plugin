identity:
  name: run_producthunt_forums_search
  author: neuralverge
  label:
    en_US: "Product Hunt forum threads"
description:
  human:
    en_US: "Browse Product Hunt forum threads page by page, or search them by keyword. 1 point per returned record."
  llm: "Browse Product Hunt forum threads page by page, or search them by keyword. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: false
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Keyword (optional). e.g. startup"
    llm_description: "Keyword (optional). e.g. startup"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_producthunt_forums_search.py
