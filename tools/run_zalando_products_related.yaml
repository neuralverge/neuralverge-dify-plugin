identity:
  name: run_zalando_products_related
  author: neuralverge
  label:
    en_US: "Zalando Related Products"
description:
  human:
    en_US: "Get related products from a Zalando product page (similar, same brand, cross-sell and sponsored recommendations): name, brand, price, discount, image, stock and reason. 1 point per returned record."
  llm: "Get related products from a Zalando product page (similar, same brand, cross-sell and sponsored recommendations): name, brand, price, discount, image, stock and reason. 1 point per returned record."
parameters:
  - name: product
    type: string
    required: true
    label:
      en_US: "Product"
    human_description:
      en_US: "Product page URL. e.g. https://www.zalando.de/nike-sportswear-court-borough-recraft-unisex-sneaker-low-white-ni116d0lr-a15.html"
    llm_description: "Product page URL. e.g. https://www.zalando.de/nike-sportswear-court-borough-recraft-unisex-sneaker-low-white-ni116d0lr-a15.html"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 60) Default: 10."
    llm_description: "Max items (up to 60) Default: 10."
    form: llm
    min: 1
    max: 60
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page Default: 1."
    llm_description: "Starting page Default: 1."
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_zalando_products_related.py
