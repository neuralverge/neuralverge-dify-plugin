identity:
  name: run_lu_companies_search
  author: neuralverge
  label:
    en_US: "Luxembourg companies search"
description:
  human:
    en_US: "Search the Luxembourg company registry (LBR / RCS) by company name or RCS number: name, RCS number, status (radiée / en faillite) and link. 1 point per returned record."
  llm: "Search the Luxembourg company registry (LBR / RCS) by company name or RCS number: name, RCS number, status (radiée / en faillite) and link. 1 point per returned record."
parameters:
  - name: keyword
    type: string
    required: true
    label:
      en_US: "Keyword"
    human_description:
      en_US: "Company name. e.g. arcelormittal"
    llm_description: "Company name. e.g. arcelormittal"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
  - name: status
    type: select
    required: false
    label:
      en_US: "Status"
    human_description:
      en_US: "Status. Options: active = Active, inactive = Inactive / dissolved"
    llm_description: "Status. Options: active = Active, inactive = Inactive / dissolved"
    form: llm
    options:
      - value: "active"
        label:
          en_US: "active"
      - value: "inactive"
        label:
          en_US: "inactive"
extra:
  python:
    source: tools/run_lu_companies_search.py
