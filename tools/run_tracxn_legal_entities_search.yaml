identity:
  name: run_tracxn_legal_entities_search
  author: neuralverge
  label:
    en_US: "Tracxn legal entities search"
description:
  human:
    en_US: "Search 21.9M registered legal entities in Tracxn by name or CIN in one of 13 countries (default India): name, CIN, incorporation date, status, associated brands and link. 1 point per returned record."
  llm: "Search 21.9M registered legal entities in Tracxn by name or CIN in one of 13 countries (default India): name, CIN, incorporation date, status, associated brands and link. 1 point per returned record."
parameters:
  - name: query
    type: string
    required: true
    label:
      en_US: "Query"
    human_description:
      en_US: "Name or CIN. e.g. supermarket grocery"
    llm_description: "Name or CIN. e.g. supermarket grocery"
    form: llm
  - name: country
    type: select
    required: false
    label:
      en_US: "Country"
    human_description:
      en_US: "Country. Options: india = India, australia = Australia, croatia = Croatia, czech-republic = Czech Republic, denmark = Denmark, estonia = Estonia, germany = Germany, new-zealand = New Zealand, norway = Norway, poland = Poland, singapore = Singapore, thailand = Thailand, united-kingdom = United Kingdom"
