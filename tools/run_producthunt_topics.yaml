identity:
  name: run_producthunt_topics
  author: neuralverge
  label:
    en_US: "Product Hunt topic products"
description:
  human:
    en_US: "Products of a Product Hunt topic: name, tagline, rating, review count, launches and categories. 1 point per returned record."
  llm: "Products of a Product Hunt topic: name, tagline, rating, review count, launches and categories. 1 point per returned record."
parameters:
  - name: topic
    type: string
    required: true
    label:
      en_US: "Topic"
    human_description:
      en_US: "Topic slug or Product Hunt URL. e.g. artificial-intelligence"
    llm_description: "Topic slug or Product Hunt URL. e.g. artificial-intelligence"
    form: llm
  - name: max_items
    type: number
    required: false
    label:
      en_US: "Max items"
    human_description:
      en_US: "Max items (up to 250) Default: 25."
    llm_description: "Max items (up to 250) Default: 25."
    form: llm
    min: 1
    max: 250
  - name: start_page
    type: number
    required: false
    label:
      en_US: "Start page"
    human_description:
      en_US: "Starting page"
    llm_description: "Starting page"
    form: llm
    min: 1
    max: 9007199254740991
extra:
  python:
    source: tools/run_producthunt_topics.py
